plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'maven-publish'
}

group = 'com.itkacher.okhttpprofiler'
version = rootProject.version

repositories {
    mavenCentral()
}

dependencies {
    api 'io.ktor:ktor-client-core:3.5.2'

    testImplementation 'io.ktor:ktor-client-mock:3.5.2'
    testImplementation 'junit:junit:4.13.2'
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'ktor-client-profiler'

            pom {
                name = 'Ktor Client Profiler'
                description = 'Ktor Client integration for the OkHttp Profiler Android Studio plugin.'
                url = 'https://github.com/xiaolong125/OkHttpProfiler-AndroidStudio-Plugin'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'xiaolong125'
                        name = 'xiaolong125'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/xiaolong125/OkHttpProfiler-AndroidStudio-Plugin.git'
                    developerConnection = 'scm:git:ssh://github.com/xiaolong125/OkHttpProfiler-AndroidStudio-Plugin.git'
                    url = 'https://github.com/xiaolong125/OkHttpProfiler-AndroidStudio-Plugin'
                }
            }
        }
    }
}
