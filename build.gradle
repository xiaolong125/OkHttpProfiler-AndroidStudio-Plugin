plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.intellij.platform' version '2.16.0'
}

group 'com.itkacher.okhttpprofiler'
version '1.0.36'

def ktorOnlyBuild = providers.gradleProperty('ktorOnlyBuild')
        .map { it.toBoolean() }
        .getOrElse(false)

if (!hasProperty('studioPath') && !ktorOnlyBuild) {
    throw new GradleException("No 'studioPath' set. Create a gradle.properties file pointing studioPath at your Android Studio (e.g. /Applications/Android Studio.app/Contents)")
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.7'
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        if (!ktorOnlyBuild) {
            local(providers.gradleProperty('studioPath'))
            bundledPlugin('org.jetbrains.android')
        }
    }
}

intellijPlatform {
    // MainForm is now plain Swing (no GUI Designer form binding), so bytecode
    // instrumentation is unnecessary and we avoid the form-compiler download entirely.
    instrumentCode = false

    pluginConfiguration {
        name = 'OkHttpProfiler'
        ideaVersion {
            sinceBuild = '241'
            untilBuild = provider { null }
        }
    }
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        // Android Studio bundles a newer Kotlin than our build compiler; skip the
        // metadata version check so its libraries on the compile classpath are readable.
        freeCompilerArgs.add('-Xskip-metadata-version-check')
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
